<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Valkyrys app</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src file:; font-src file:">

<style>
  /* Only transform and opacity are animated (compositor-only, no layout or repaint per frame).
     Nothing plays until both images are decoded and a first frame is painted (class "go").
     Colours, font and card shape follow the app's dark theme and lock-screen card (tool/css/base.css, lockscreen.css). */
  @font-face { font-family: "Carlito"; src: url(../web/fonts/Carlito-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "Carlito"; src: url(../web/fonts/Carlito-Bold.ttf); font-weight: 700; }
  :root { --s: 0.32; --yellow: #FEBD17; --surface: #141517; --line: #2A2C30; --muted: #9A9DA4; --faint: #5E6168;
    --ease: cubic-bezier(.22,1,.36,1); --ease-io: cubic-bezier(.65,0,.35,1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default; }
  body { display: grid; place-items: center; font-family: "Lato", "Carlito", "Segoe UI", system-ui, sans-serif; }

  .panel { position: relative; width: 100%; height: 100%; border-radius: 18px; overflow: hidden; isolation: isolate;
    background: radial-gradient(90% 70% at 50% 38%, #1A1B1E 0%, var(--surface) 60%, #0F1012 100%);
    border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    opacity: 0; transform: scale(.985); will-change: opacity, transform; }
  .go .panel { animation: panelIn .6s var(--ease) forwards; }
  @keyframes panelIn { to { opacity: 1; transform: scale(1); } }
  .exit .panel { animation: leave .55s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes leave { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.02); } }


  .stage { position: absolute; left: 0; right: 0; top: 0; bottom: 56px; display: grid; place-items: center; }
  .row { display: flex; align-items: center; justify-content: center; height: calc(318px * var(--s)); }
  .masked { -webkit-mask-repeat: no-repeat; -webkit-mask-size: 100% 100%; position: relative; overflow: hidden; background: #fff; }
  .masked.m { width: calc(403px * var(--s)); height: calc(318px * var(--s)); -webkit-mask-image: url(emblem.png); }
  .masked.w { width: calc(935px * var(--s)); height: calc(318px * var(--s)); -webkit-mask-image: url(word.png); background: #F3F3F4; }
  /* shine: a narrow band that moves across, clipped by the logo's mask */
  .shine { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(254,189,23,0) 30%, var(--yellow) 50%, rgba(254,189,23,0) 70%);
    transform: translateX(-110%); will-change: transform; }

  /* the whole logo fades in with a slight rise (the wordmark a beat after the V), then one gold shine sweeps across it; nothing slides sideways */
  .markbox, .reveal { flex: none; }
  .reveal { margin-left: calc(27px * var(--s)); }
  .mark, .word { opacity: 0; transform: translateY(8px); will-change: opacity, transform; }
  .go .mark { animation: markIn .9s .2s var(--ease) forwards; }
  .go .word { animation: wordIn .9s .32s var(--ease) forwards; }
  @keyframes markIn { to { opacity: 1; transform: none; } }
  @keyframes wordIn { to { opacity: 1; transform: none; } }
  /* one sweep from the V's left edge to the wordmark's right edge (same speed in both parts) */
  .go .mark .shine { animation: shine .45s 1.25s linear forwards; }
  .go .word .shine { animation: shine .95s 1.6s linear forwards; }
  @keyframes shine { to { transform: translateX(110%); } }

  /* footer: what the app is doing right now, the version, and a thin progress line that follows the real start-up steps */
  .foot { position: absolute; left: 32px; right: 32px; bottom: 24px; opacity: 0; transform: translateY(6px); will-change: opacity, transform; }
  .go .foot { animation: footIn .7s .5s var(--ease) forwards; }
  @keyframes footIn { to { opacity: 1; transform: none; } }
  .track { position: relative; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.07); }
  .fill { position: absolute; inset: 0; border-radius: 2px; background: var(--yellow); transform: scaleX(0); transform-origin: 0 50%;
    transition: transform .6s var(--ease); will-change: transform; }
  .sheen { position: absolute; top: 0; bottom: 0; left: 0; width: 90px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
    transform: translateX(-100px); will-change: transform; }
  .go .sheen { animation: sheen 1.6s .9s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes sheen { to { transform: translateX(510px); } }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 12px; font-size: 13px; line-height: 16px; }
  .status { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ver { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .done .sheen { animation: none; opacity: 0; }
</style></head>
<body>
  <div class="panel">
    <div class="stage">
      <div class="row">
        <div class="markbox">
          <div class="mark"><div class="masked m"><div class="shine"></div></div></div>
        </div>
        <div class="reveal"><div class="word"><div class="masked w"><div class="shine"></div></div></div></div>
      </div>
    </div>
    <div class="foot">
      <div class="track"><div class="fill"></div><div class="sheen"></div></div>
      <div class="meta"><span class="status" id="status">&nbsp;</span><span class="ver" id="ver"></span></div>
    </div>
  </div>
<script>
  // window.splash: state "loading" -> "playing" -> "holding" (animation ended, finished logo stays) -> "done" (main may take over) -> "leaving"
  // splashDone resolves at "done"; splashExit() fills the line, fades the panel out and resolves when the fade has ended (main closes the window then).
  // splashStep(name): main says a start-up step has finished ("upd" update check, "mail" mail check, "app" main window loaded);
  // the line and the status text follow them. ?lang=nl|en|pl&v=<version> come from main.
  const HOLD_MS = 800;
  const q = new URLSearchParams(location.search);
  const TEXT = {
    nl: { upd: "Zoeken naar updates…", mail: "Mail controleren…", app: "App laden…", ready: "Klaar" },
    en: { upd: "Checking for updates…", mail: "Checking mail…", app: "Loading the app…", ready: "Ready" },
    pl: { upd: "Szukam aktualizacji…", mail: "Sprawdzam pocztę…", app: "Ładuję aplikację…", ready: "Gotowe" } };
  const lang = TEXT[q.get("lang")] ? q.get("lang") : "nl", T = TEXT[lang];
  document.documentElement.lang = lang;
  if (q.get("v")) document.getElementById("ver").textContent = "v" + q.get("v");
  const STEPS = ["upd", "mail", "app"], doneSteps = new Set();
  const fill = document.querySelector(".fill"), statusEl = document.getElementById("status");
  let shown = "";
  function paint() {
    const left = STEPS.filter((s) => !doneSteps.has(s));
    const txt = window.splash.state === "leaving" || !left.length ? T.ready : T[left[0]];
    // a little is already filled at the start, each finished step adds its share, the last bit is the hand-over
    const p = window.splash.state === "leaving" ? 1 : 0.08 + 0.84 * (doneSteps.size / STEPS.length);
    fill.style.transform = `scaleX(${p})`;
    if (txt !== shown) {
      shown = txt; statusEl.textContent = txt;
      if (document.body.classList.contains("go")) statusEl.animate([{ opacity: 0, transform: "translateY(3px)" }, { opacity: 1, transform: "none" }], { duration: 260, easing: "ease-out" });
    }
  }
  window.splashStep = (name) => { if (STEPS.includes(name)) { doneSteps.add(name); paint(); } return true; };

  window.splash = { state: "loading", animEndAt: 0 }; // the logo animation always plays (also when Windows animation effects are off)
  paint();
  const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
  const later = (ms) => new Promise((r) => setTimeout(r, ms));
  window.splashDone = (async () => {
    // decode the two logo images before anything moves, so the first frames don't stutter (the masks reuse the cached decode)
    await Promise.race([Promise.all(["emblem.png", "word.png"].map((src) => { const i = new Image(); i.src = src; return i.decode().catch(() => {}); })), later(1500)]);
    await frame(); await frame();
    document.body.classList.add("go"); window.splash.state = "playing";
    await frame();
    // the logo animation (not the endless sheen on the line, not the line's transitions)
    const anims = document.getAnimations().filter((a) => a.animationName && a.animationName !== "sheen");
    await Promise.race([Promise.all(anims.map((a) => a.finished.catch(() => {}))), later(6000)]);
    window.splash.state = "holding"; window.splash.animEndAt = performance.now();
    await later(HOLD_MS);
    window.splash.state = "done";
    return true;
  })();
  window.splashExit = () => new Promise((res) => {
    window.splash.state = "leaving";
    document.body.classList.add("done"); paint();
    const panel = document.querySelector(".panel");
    const done = () => { window.splash.state = "gone"; res(true); };
    panel.addEventListener("animationend", (e) => { if (e.animationName === "leave") done(); });
    setTimeout(done, 1100); // safety if animationend never comes
    setTimeout(() => document.body.classList.add("exit"), 220); // let the line reach the end first
  });
</script>
</body></html>
