<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Valkyrys app</title>
<style>
  :root { --s: 0.34; --yellow: #FEBD17; --total: 3.4s; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default; }
  body { display: grid; place-items: center; font-family: "Segoe UI", Lato, system-ui, sans-serif; }
  body.exit .panel { animation: leave .38s ease-in forwards; }
  @keyframes leave { to { opacity: 0; transform: scale(1.03); } }

  .panel { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 40%, #1b1b1d 0%, #0d0d0e 62%, #070708 100%); border: 1px solid #2a2a2d;
    animation: panelIn .5s ease-out both; }
  @keyframes panelIn { from { opacity: 0; } to { opacity: 1; } }
  .panel::before { content: ""; position: absolute; left: 50%; top: 46%; width: 520px; height: 520px; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(254,189,23,.10), rgba(254,189,23,0) 70%); opacity: 0; animation: halo 2.4s .7s ease-out forwards; }
  @keyframes halo { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 40% { opacity: 1; } 100% { opacity: .55; transform: translate(-50%, -50%) scale(1); } }

  .stage { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -14px; }
  .row { display: flex; align-items: center; justify-content: center; height: calc(318px * var(--s)); }

  /* the V: wipes in from the top, then ignites */
  .mark, .word { background: linear-gradient(100deg, #fff 0%, #fff 42%, var(--yellow) 50%, #fff 58%, #fff 100%); background-size: 320% 100%; background-position: 120% 0;
    -webkit-mask-repeat: no-repeat; -webkit-mask-size: 100% 100%; flex: none; }
  .mark { width: calc(403px * var(--s)); height: calc(318px * var(--s)); -webkit-mask-image: url(emblem.png); position: relative; z-index: 2;
    opacity: 0; clip-path: inset(0 0 100% 0);
    animation: markIn .85s .2s cubic-bezier(.22,.8,.2,1) forwards, ignite 1.1s .95s ease-out forwards, shineA 1s 2.05s ease-in-out forwards; }
  @keyframes markIn { 0% { opacity: 0; clip-path: inset(0 0 100% 0); transform: scale(.9); }
                      25% { opacity: 1; }
                      100% { opacity: 1; clip-path: inset(0 0 0 0); transform: scale(1); } }
  @keyframes ignite { 0% { filter: drop-shadow(0 0 0 rgba(254,189,23,0)); } 22% { filter: drop-shadow(0 0 22px rgba(254,189,23,.75)); } 100% { filter: drop-shadow(0 0 10px rgba(254,189,23,.18)); } }
  @keyframes shineA { from { background-position: 120% 0; } to { background-position: -20% 0; } }

  /* the wordmark: grows out of the V's right side, so the V slides left and the whole logo ends up centred */
  .reveal { width: 0; margin-left: 0; overflow: hidden; height: 100%; flex: none; animation: slide 1s 1.2s cubic-bezier(.7,0,.15,1) forwards; }
  @keyframes slide { to { width: calc(935px * var(--s)); margin-left: calc(27px * var(--s)); } }
  .word { width: calc(935px * var(--s)); height: calc(318px * var(--s)); -webkit-mask-image: url(word.png); transform: translateX(-100%); opacity: 0;
    animation: wordIn 1s 1.2s cubic-bezier(.7,0,.15,1) forwards, shineB 1s 2.25s ease-in-out forwards; }
  @keyframes wordIn { 0% { opacity: 0; } 12% { opacity: 1; } 100% { transform: translateX(0); opacity: 1; } }
  @keyframes shineB { from { background-position: 120% 0; } to { background-position: -20% 0; } }

  .line { height: 2px; width: 0; margin-top: 20px; background: linear-gradient(90deg, rgba(254,189,23,0), var(--yellow), rgba(254,189,23,0)); animation: line .9s 2.3s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes line { to { width: 200px; } }
  .sub { margin-top: 12px; font-size: 11px; font-weight: 600; letter-spacing: .62em; padding-left: .62em; color: #8d8d92; opacity: 0; animation: sub .8s 2.4s ease-out forwards; }
  @keyframes sub { from { opacity: 0; letter-spacing: .9em; } to { opacity: 1; letter-spacing: .62em; } }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.04); }
  .bar i { display: block; height: 100%; width: 0; background: var(--yellow); box-shadow: 0 0 10px rgba(254,189,23,.6); animation: bar 3.1s .25s cubic-bezier(.4,.1,.3,1) forwards; }
  @keyframes bar { to { width: 100%; } }
</style></head>
<body>
  <div class="panel">
    <div class="stage">
      <div class="row"><div class="mark"></div><div class="reveal"><div class="word"></div></div></div>
      <div class="line"></div>
      <div class="sub">APP</div>
    </div>
    <div class="bar"><i></i></div>
  </div>
</body></html>
